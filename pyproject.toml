[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bionexuslab"
version = "0.1.0"
description = "Framework for agentic drug discovery — pluggable models, bio tools, labs, and sandboxes behind five core interfaces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
store-postgres = ["psycopg[binary]>=3"]
sandbox-agentenv = []  # adapter uses stdlib urllib; extra kept as a marker
sandbox-opensandbox = ["opensandbox>=0.1"]
mcp-instruments = ["labmcp>=0.1"]  # servers (labmcp-<vendor>) installed per instrument
models-openai = ["httpx>=0.27"]
bio-rdkit = ["rdkit>=2023.9"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27",
       "python-multipart>=0.0.9"]
lab-imaging = ["numpy>=1.24"]
lab-xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
bn = "bionexus.cli:main"

[project.entry-points."bionexus.models"]
openai_compat = "bionexus.adapters.models.openai_compat:OpenAICompatProvider"

[project.entry-points."bionexus.labs"]
simulator = "bionexus.adapters.lab.simulator:SimulatorLab"

[project.entry-points."bionexus.stores"]
sqlite = "bionexus.adapters.store.sqlite:SqliteProvenanceStore"

[project.entry-points."bionexus.sandboxes"]
local = "bionexus.adapters.sandbox.local:LocalSandbox"

[tool.hatch.build.targets.wheel]
packages = ["src/bionexus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
