<svg width="1120" viewBox="0 0 1120 640" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e3ded2" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1120" height="640" fill="#f3f1ea"/><rect x="0" y="0" width="1120" height="640" fill="url(#grid)"/>
