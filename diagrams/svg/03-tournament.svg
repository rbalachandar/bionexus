        <text x="920" y="152" text-anchor="middle" font-size="14" fill="#175a64" font-weight="600">3 · Rank</text>
        <text x="920" y="172" text-anchor="middle" font-size="10" fill="#3d7d87" font-family="IBM Plex Mono, monospace">Elo tournament · c.evals.rank_batch</text>
        <text x="920" y="188" text-anchor="middle" font-size="10" fill="#3d7d87" font-family="IBM Plex Mono, monospace">pairwise debate + meta-reviewer</text>
      </g>

      
      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="430" y="360" width="230" height="96" rx="3" fill="#e9f2e6" stroke="#3f8a4a" stroke-opacity="0.7"/>
        <text x="545" y="392" text-anchor="middle" font-size="14" fill="#2f6b38" font-weight="600">4 · Evolve</text>
        <text x="545" y="412" text-anchor="middle" font-size="10" fill="#4e8a58" font-family="IBM Plex Mono, monospace">mutate / combine top-k</text>
        <text x="545" y="428" text-anchor="middle" font-size="10" fill="#4e8a58" font-family="IBM Plex Mono, monospace">losers → ablation provenance</text>
      </g>

      
      <line x1="300" y1="168" x2="428" y2="168" stroke="#6b6558" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="660" y1="168" x2="788" y2="168" stroke="#6b6558" stroke-width="1.4" marker-end="url(#arrow)"/>
