      <text x="120" y="520" font-size="10" font-family="IBM Plex Mono, monospace" fill="#6b6558">assay ground truth</text>

      <text x="70" y="80" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#8a8272">
