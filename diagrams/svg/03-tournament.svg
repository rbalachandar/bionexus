        <text x="545" y="152" text-anchor="middle" font-size="14" fill="#2f6b38" font-weight="600">2 · Reflect</text>
        <text x="545" y="172" text-anchor="middle" font-size="10" fill="#4e8a58" font-family="IBM Plex Mono, monospace">self + cross critique</text>
        <text x="545" y="188" text-anchor="middle" font-size="10" fill="#4e8a58" font-family="IBM Plex Mono, monospace">structured review rubric</text>
