<svg width="1120" viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#131b23" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1120" height="620" fill="#0a0f14"/><rect x="0" y="0" width="1120" height="620" fill="url(#grid)"/>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#5a6f7e"/>
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#8fd694"/>
        </marker>
      </defs>

      <!-- Row 1 -->
      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="40" y="60" width="180" height="76" rx="3" fill="#0f1a1c" stroke="#5ecbd6" stroke-opacity="0.7"/>
        <text x="130" y="92" text-anchor="middle" font-size="13.5" fill="#c9edf1" font-weight="600">Target Agent</text>
        <text x="130" y="111" text-anchor="middle" font-size="10" fill="#6f9da3" font-family="IBM Plex Mono, monospace">dossier from literature</text>

        <rect x="280" y="60" width="180" height="76" rx="3" fill="#0e1a12" stroke="#8fd694" stroke-opacity="0.7"/>
        <text x="370" y="92" text-anchor="middle" font-size="13.5" fill="#d3f0d6" font-weight="600">Design Agent</text>
        <text x="370" y="111" text-anchor="middle" font-size="10" fill="#7fb587" font-family="IBM Plex Mono, monospace">N candidates · tournament</text>

        <rect x="520" y="60" width="180" height="76" rx="3" fill="#0e1a12" stroke="#8fd694" stroke-opacity="0.7"/>
        <text x="610" y="92" text-anchor="middle" font-size="13.5" fill="#d3f0d6" font-weight="600">Evaluation Harness</text>
        <text x="610" y="111" text-anchor="middle" font-size="10" fill="#7fb587" font-family="IBM Plex Mono, monospace">benchmarks · Elo rank</text>

        <rect x="760" y="60" width="160" height="76" rx="3" fill="#0e1a12" stroke="#8fd694" stroke-opacity="0.7"/>
        <text x="840" y="92" text-anchor="middle" font-size="13.5" fill="#d3f0d6" font-weight="600">In-silico Assays</text>
        <text x="840" y="111" text-anchor="middle" font-size="10" fill="#7fb587" font-family="IBM Plex Mono, monospace">docking · MD · ADMET</text>

        <rect x="960" y="60" width="130" height="76" rx="3" fill="#1a150e" stroke="#e8b04b" stroke-opacity="0.8"/>
        <text x="1025" y="92" text-anchor="middle" font-size="13.5" fill="#f2e2b8" font-weight="600">Human Gate</text>
        <text x="1025" y="111" text-anchor="middle" font-size="10" fill="#a8946a" font-family="IBM Plex Mono, monospace">sandbox paused</text>
      </g>

      <line x1="220" y1="98" x2="278" y2="98" stroke="#5a6f7e" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="460" y1="98" x2="518" y2="98" stroke="#5a6f7e" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="700" y1="98" x2="758" y2="98" stroke="#5a6f7e" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="920" y1="98" x2="958" y2="98" stroke="#5a6f7e" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="238" y="88" font-size="10" font-family="IBM Plex Mono, monospace" fill="#5a6f7e">dossier</text>
      <text x="468" y="88" font-size="10" font-family="IBM Plex Mono, monospace" fill="#5a6f7e">candidates</text>
      <text x="708" y="88" font-size="10" font-family="IBM Plex Mono, monospace" fill="#5a6f7e">top-K</text>
      <text x="918" y="118" font-size="10" font-family="IBM Plex Mono, monospace" fill="#5a6f7e">survivors</text>

      <!-- Row 2 -->
      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="760" y="250" width="160" height="76" rx="3" fill="#0e1a12" stroke="#8fd694" stroke-opacity="0.7"/>
        <text x="840" y="282" text-anchor="middle" font-size="13.5" fill="#d3f0d6" font-weight="600">Assay Planning</text>
        <text x="840" y="301" text-anchor="middle" font-size="10" fill="#7fb587" font-family="IBM Plex Mono, monospace">abstract protocol</text>

        <rect x="520" y="250" width="180" height="76" rx="3" fill="#0e1a12" stroke="#8fd694" stroke-opacity="0.7"/>
        <text x="610" y="282" text-anchor="middle" font-size="13.5" fill="#d3f0d6" font-weight="600">Lab Execution</text>
        <text x="610" y="301" text-anchor="middle" font-size="10" fill="#7fb587" font-family="IBM Plex Mono, monospace">safety · IAL · instruments</text>

        <rect x="280" y="250" width="180" height="76" rx="3" fill="#0e1a12" stroke="#8fd694" stroke-opacity="0.7"/>
        <text x="370" y="282" text-anchor="middle" font-size="13.5" fill="#d3f0d6" font-weight="600">Analysis Agent</text>
        <text x="370" y="301" text-anchor="middle" font-size="10" fill="#7fb587" font-family="IBM Plex Mono, monospace">findings · proposals</text>

        <rect x="40" y="250" width="180" height="76" rx="3" fill="#12101a" stroke="#b295e0" stroke-opacity="0.7"/>
        <text x="130" y="282" text-anchor="middle" font-size="13.5" fill="#e2d4f3" font-weight="600">Provenance Store</text>
        <text x="130" y="301" text-anchor="middle" font-size="10" fill="#a189bd" font-family="IBM Plex Mono, monospace">every hop recorded</text>
      </g>

      <!-- connectors row1 -> row2 -->
      <path d="M1025,136 L1025,200 L840,200 L840,248" fill="none" stroke="#5a6f7e" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="860" y="190" font-size="10" font-family="IBM Plex Mono, monospace" fill="#5a6f7e">approved</text>
      <line x1="760" y1="288" x2="702" y2="288" stroke="#5a6f7e" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="520" y1="288" x2="462" y2="288" stroke="#5a6f7e" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="480" y="278" font-size="10" font-family="IBM Plex Mono, monospace" fill="#5a6f7e">AssayResult</text>
      <line x1="280" y1="288" x2="222" y2="288" stroke="#445562" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

      <!-- loop back: analysis -> design agent -->
      <path d="M370,248 L370,180 L370,166" fill="none" stroke="#8fd694" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
      <text x="386" y="216" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#8fd694">next_round_proposals — active learning loop</text>

      <!-- side: sandbox substrate -->
      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="40" y="420" width="1040" height="110" fill="none" stroke="#b295e0" stroke-width="1.2" stroke-opacity="0.55" rx="2"/>
        <text x="56" y="446" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.5" fill="#b295e0">SANDBOX SUBSTRATE (AGENTENV · L3)</text>
        <rect x="120" y="462" width="290" height="52" rx="3" fill="#160f1c" stroke="#b295e0" stroke-opacity="0.7"/>
        <text x="265" y="493" text-anchor="middle" font-size="13" fill="#e2d4f3" font-weight="600">fork per experiment branch</text>
        <rect x="460" y="462" width="290" height="52" rx="3" fill="#160f1c" stroke="#b295e0" stroke-opacity="0.7"/>
        <text x="605" y="493" text-anchor="middle" font-size="13" fill="#e2d4f3" font-weight="600">snapshot at the human gate</text>
        <rect x="800" y="462" width="220" height="52" rx="3" fill="#160f1c" stroke="#b295e0" stroke-opacity="0.7"/>
        <text x="910" y="493" text-anchor="middle" font-size="13" fill="#e2d4f3" font-weight="600">replay for audits</text>
      </g>

      <text x="40" y="580" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#445562">
        SOLID = DATA/CONTROL FLOW · GREEN = ITERATION FEEDBACK · VIOLET = PROVENANCE WRITES (EVERY HOP)
      </text>
    </svg>