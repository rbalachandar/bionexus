<svg width="1120" viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e3ded2" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1120" height="620" fill="#f3f1ea"/><rect x="0" y="0" width="1120" height="620" fill="url(#grid)"/>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#6b6558"/>
        </marker>
        <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#a97a1c"/>
        </marker>
        <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#b05a48"/>
        </marker>
        <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#3f8a4a"/>
        </marker>
      </defs>

      
      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="60" y="60" width="240" height="90" rx="18" fill="#e9f2e6" stroke="#3f8a4a" stroke-opacity="0.7"/>
        <text x="180" y="98" text-anchor="middle" font-size="14" fill="#2f6b38" font-weight="600">Design Iteration</text>
        <text x="180" y="118" text-anchor="middle" font-size="10" fill="#4e8a58" font-family="IBM Plex Mono, monospace">sandbox created per branch</text>
      </g>

      
      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="440" y="60" width="240" height="90" rx="3" fill="#f9f1dc" stroke="#a97a1c" stroke-opacity="0.85"/>
        <text x="560" y="98" text-anchor="middle" font-size="14" fill="#5c4113" font-weight="600">Review Gate</text>
        <text x="560" y="118" text-anchor="middle" font-size="10" fill="#8a6a2c" font-family="IBM Plex Mono, monospace">snapshot · full agent state frozen</text>
      </g>
      <path d="M680,105 L720,105 L720,50 L796,50" fill="none" stroke="#a97a1c" stroke-width="1.4" marker-end="url(#arrowA)"/><line x1="720" y1="105" x2="796" y2="116" stroke="#a97a1c" stroke-width="1.4"/><line x1="722" y1="116" x2="796" y2="116" stroke="#a97a1c" stroke-width="1.4"/><path d="M720,116 L720,182 L796,182" fill="none" stroke="#a97a1c" stroke-width="1.4" marker-end="url(#arrowA)"/><text x="700" y="93" font-size="10" font-family="IBM Plex Mono, monospace" fill="#a97a1c">approve</text><line x1="300" y1="105" x2="438" y2="105" stroke="#6b6558" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="316" y="94" font-size="10" font-family="IBM Plex Mono, monospace" fill="#6b6558">snapshot</text>

      
      <path d="M560,152 L560,225 L130,225 L130,152" fill="none" stroke="#b05a48" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrowR)"/>
      <text x="230" y="240" font-size="10" font-family="IBM Plex Mono, monospace" fill="#b05a48">reject → restore snapshot, redirect</text>

      
      
      <text x="696" y="94" font-size="10" font-family="IBM Plex Mono, monospace" fill="#a97a1c">approve</text>

      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="800" y="24" width="270" height="52" rx="3" fill="#e9f2e6" stroke="#3f8a4a" stroke-opacity="0.7"/>
        <text x="935" y="56" text-anchor="middle" font-size="13" fill="#2f6b38" font-weight="600">Branch A — assay variant 1</text>
        <rect x="800" y="90" width="270" height="52" rx="3" fill="#e9f2e6" stroke="#3f8a4a" stroke-opacity="0.7"/>
        <text x="935" y="122" text-anchor="middle" font-size="13" fill="#2f6b38" font-weight="600">Branch B — assay variant 2</text>
        <rect x="800" y="156" width="270" height="52" rx="3" fill="#e9f2e6" stroke="#3f8a4a" stroke-opacity="0.55" stroke-dasharray="3 3"/>
        <text x="935" y="188" text-anchor="middle" font-size="13" fill="#4e8a58" font-weight="600">Branch N — parallel hypotheses</text>
      </g>
      
      
      
      <text x="812" y="230" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#6b6558">fork per hypothesis — isolated sandboxes</text>

      
      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="440" y="300" width="240" height="76" rx="3" fill="#e9f2e6" stroke="#3f8a4a" stroke-opacity="0.7"/>
        <text x="560" y="332" text-anchor="middle" font-size="14" fill="#2f6b38" font-weight="600">Assay Results</text>
        <text x="560" y="352" text-anchor="middle" font-size="10" fill="#4e8a58" font-family="IBM Plex Mono, monospace">per-branch AssayResult + lineage</text>
      </g>
      
      
      

      
      <path d="M440,338 L180,338 L180,152" fill="none" stroke="#3f8a4a" stroke-width="1.6" marker-end="url(#arrowG)"/>
      <text x="200" y="330" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#3f8a4a">analysis feeds the next iteration round</text>

      
      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="60" y="440" width="1010" height="130" fill="none" stroke="#6a4fa0" stroke-width="1.2" stroke-opacity="0.55" rx="2"/>
        <text x="76" y="466" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.5" fill="#6a4fa0">WHY THIS IS UNIQUE</text>
        <text x="90" y="500" font-size="13" fill="#2a2823">Snapshot captures the <tspan font-weight="600" fill="#4c3a75">full agent state</tspan> — prompts, tool context, working memory — not just outputs.</text>
        <text x="90" y="526" font-size="13" fill="#2a2823">Fork at hypothesis split points gives isolated, parallel experiment trees on shared infrastructure.</text>
        <text x="90" y="552" font-size="13" fill="#2a2823">Every branch is <tspan font-weight="600" fill="#4c3a75">replayable for audits</tspan> — a regulatory-grade property no published system surfaces.</text>
      </g>
    </svg>