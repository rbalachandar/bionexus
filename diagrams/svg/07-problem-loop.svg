<svg width="1120" viewBox="0 0 1120 660" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e3ded2" stroke-width="1"/></pattern></defs><rect width="1120" height="660" fill="#f3f1ea"/><rect width="1120" height="660" fill="url(#grid)"/>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#6b6558"/>
        </marker>
        <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#3f8a4a"/>
        </marker>
      </defs>

      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="40" y="60" width="480" height="110" rx="3" fill="#fbf3de" stroke="#a97a1c" stroke-opacity="0.8"/>
        <text x="60" y="88" font-size="14" fill="#5c4113" font-weight="600">0 · Problem + Constraints</text>
        <text x="60" y="110" font-size="10.5" fill="#8a6a2c" font-family="IBM Plex Mono, monospace">objective · context · success_metric</text>
        <text x="60" y="126" font-size="10.5" fill="#8a6a2c" font-family="IBM Plex Mono, monospace">Constraint[]: hard / soft / preference</text>
        <text x="60" y="152" font-size="10" fill="#a8946a" font-family="IBM Plex Mono, monospace">problem_defined → provenance</text>

        <rect x="600" y="60" width="480" height="110" rx="3" fill="#e9f2e6" stroke="#3f8a4a" stroke-opacity="0.7"/>
        <text x="620" y="88" font-size="14" fill="#2f6b38" font-weight="600">1 · Hypothesis Portfolio (N proposed)</text>
        <text x="620" y="110" font-size="10.5" fill="#4e8a58" font-family="IBM Plex Mono, monospace">statement · rationale · prediction each</text>
        <text x="620" y="126" font-size="10.5" fill="#4e8a58" font-family="IBM Plex Mono, monospace">rejected ones stay on record — never deleted</text>
        <text x="620" y="152" font-size="10" fill="#7fb587" font-family="IBM Plex Mono, monospace">hypothesis_proposed × N → provenance</text>
      </g>
      <line x1="520" y1="115" x2="598" y2="115" stroke="#6b6558" stroke-width="1.4" marker-end="url(#arrow)"/>

      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="600" y="210" width="480" height="86" rx="3" fill="#e4f1f3" stroke="#1f7a86" stroke-opacity="0.7"/>
        <text x="620" y="238" font-size="14" fill="#175a64" font-weight="600">2 · Analyze + Filter → top-k</text>
        <text x="620" y="260" font-size="10.5" fill="#3d7d87" font-family="IBM Plex Mono, monospace">score_fn ranks; every accept/reject recorded with reason</text>
        <text x="620" y="276" font-size="10" fill="#6f9da3" font-family="IBM Plex Mono, monospace">hypotheses_filtered → provenance</text>
      </g>
      <path d="M840,150 L840,208" fill="none" stroke="#6b6558" stroke-width="1.4" marker-end="url(#arrow)"/>

      <!-- per-hypothesis loop -->
      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="150" y="230" width="360" height="130" rx="3" fill="#e4f1f3" stroke="#1f7a86" stroke-opacity="0.7"/>
        <text x="170" y="258" font-size="14" fill="#175a64" font-weight="600">3 · Per selected hypothesis</text>
        <text x="170" y="280" font-size="10.5" fill="#3d7d87" font-family="IBM Plex Mono, monospace">proposed → designed → safety-gated submission</text>
        <text x="170" y="296" font-size="10.5" fill="#3d7d87" font-family="IBM Plex Mono, monospace">→ performed in lab/device (images on disk)</text>
        <text x="170" y="312" font-size="10.5" fill="#3d7d87" font-family="IBM Plex Mono, monospace">→ device event → agent notices → analyzed</text>
        <text x="170" y="328" font-size="10.5" fill="#3d7d87" font-family="IBM Plex Mono, monospace">→ verdict vs pre-registered criteria</text>
      </g>
      <path d="M600,296 L560,296 L560,295 L512,295" fill="none" stroke="#6b6558" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="520" y="284" font-size="10" font-family="IBM Plex Mono, monospace" fill="#6b6558">k hypotheses → parallel branches</text>

      <!-- autonomy strip -->
      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="150" y="396" width="930" height="76" rx="3" fill="#efeaf6" stroke="#6a4fa0" stroke-opacity="0.7"/>
        <text x="170" y="424" font-size="14" fill="#4c3a75" font-weight="600">Autonomy level (operator-set, per campaign)</text>
        <text x="170" y="448" font-size="11" fill="#6f5a99" font-family="IBM Plex Mono, monospace">observe: reads + recommends, submits nothing   ·   gate: every submission needs operator approval   ·   act: autonomous inside SafetyEngine</text>
      </g>

      <!-- confirmation loop back -->
      <path d="M330,360 L330,394" fill="none" stroke="#3f8a4a" stroke-width="1.6" marker-end="url(#arrowG)"/>
      <text x="344" y="382" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#3f8a4a">confirmation assay auto-submitted (safety-approved)</text>
      <path d="M330,436 L330,470 L120,470 L120,172" fill="none" stroke="#3f8a4a" stroke-width="1.6" stroke-dasharray="6 3"/>
      <text x="140" y="490" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#3f8a4a">next round — proposals refine with each loop (active learning)</text>
      <path d="M120,470 L120,170" fill="none" stroke="#3f8a4a" stroke-width="0"/>

      <!-- provenance spine -->
      <g font-family="IBM Plex Sans, sans-serif">
        <rect x="40" y="530" width="1040" height="90" rx="3" fill="#efeaf6" stroke="#6a4fa0" stroke-opacity="0.6"/>
        <text x="56" y="558" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.5" fill="#6a4fa0">PROVENANCE SPINE — EVERY ARROW ABOVE IS A HASH-CHAINED RECORD</text>
        <text x="76" y="586" font-size="12.5" fill="#2a2823">problem_defined · hypothesis_proposed ×N · hypotheses_filtered (with reasons) · lab_run · hypothesis_tested/validated/invalidated</text>
        <text x="76" y="606" font-size="12.5" fill="#2a2823">bn prove &lt;problem-id&gt; --html → tamper-evident, shareable audit of the entire campaign</text>
      </g>
    </svg>