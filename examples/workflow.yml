# BioNexus workflow — run with: bn auto examples/workflow.yml
problem:
  objective: "Identify active HPK1 inhibitors from the compound series"
  constraints:
    - name: potency
      description: "IC50 <= 20 uM"
      kind: hard
      limit: 20.0
      unit: uM
  success_metric: "orthogonal confirmation"

model:
  name: stub-1

lab:
  adapter: simulator
  seed: 42

store:
  path: bionexus.db

hypotheses:
  - statement: "C-101 binds HPK1 with IC50 <= 20 uM"
    candidate: "C-101"
    assay_type: binding
    predicted: "IC50 <= 20 uM"
    predicted_value: 20.0
    rationale: "covalent warhead precedent"
  - statement: "C-102 binds HPK1 with IC50 <= 20 uM"
    candidate: "C-102"
    assay_type: binding
    predicted: "IC50 <= 20 uM"
    predicted_value: 20.0
    rationale: "scaffold hop"

k: 2
autonomy: act
