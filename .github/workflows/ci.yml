name: ci

on:
  # push trigger REMOVED: private-repo free minutes; run on demand with
  #   gh workflow run ci.yml   (or open a PR / wait for Mondays)
  pull_request:
    # once per PR, not every push to its branch; close+reopen re-runs cheaply
    types: [opened, reopened]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # weekly proof the suite still passes

jobs:
  core:  # P1: fast, dependency-light, no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pydantic pytest fastapi httpx python-multipart && pip install -e . --no-deps
      - name: Unit suite (offline — live docker contract has its own job)
        env: {BN_SKIP_DOCKER: "1"}
        run: python -m pytest tests/ -q    # includes the anti-bloat import scan

  api:  # web backend: endpoints + SSE over seeded stores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pydantic pytest fastapi httpx python-multipart && pip install -e . --no-deps
      - run: python -m pytest tests/test_api.py tests/test_views.py -q

  web:  # React SPA: typecheck + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  e2e:  # P8: full DMTA flow + templates + recording playback on the virtual lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pydantic pytest pyyaml numpy fastapi httpx python-multipart rdkit labmcp-mettler-toledo labmcp-ika && pip install -e . --no-deps
      - name: Full flow (all layers)
        run: python examples/demo_full_flow.py
      - name: Provenance audit
        run: python -m bionexus.cli prove full-flow --db full_flow.db
      # - name: Template campaign
      #   run: python -m bionexus.cli auto examples/workflow.yml --db bionexus.db
      # - name: Provenance audit (template)
      #   run: python -m bionexus.cli prove demo-run --db bionexus.db
      - name: Test suite
        env: {BN_SKIP_DOCKER: "1"}
        run: python -m pytest tests/ -q

  eval:  # T1: the measurable claim — epistemics + model tiers, offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pydantic pytest && pip install -e . --no-deps
      - name: Fetch MoleculeNet datasets (models tier cache)
        run: |
          mkdir -p .data
          curl -sL https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/Lipophilicity.csv -o .data/lipophilicity.csv
          curl -sL https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/delaney-processed.csv -o .data/esol.csv
          curl -sL https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/HIV.csv -o .data/hiv.csv
      - name: Eval suite (epistemics + models)
        run: python -m bionexus.cli eval --suite epistemics,models
      - name: Provenance anchoring roundtrip
        run: |
          python -m bionexus.cli anchor --db bionexus.db || true
          python -m bionexus.cli eval --task hit-recovery >/dev/null

  fixtures:  # byte-reproducible case-study data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pydantic && pip install -e . --no-deps
      - run: |
          python -m bionexus.cli fixtures verify case-studies/01-egfr-blind-reproduction
          python -m bionexus.cli fixtures verify case-studies/02-az3246-hpk1
          python -m bionexus.cli fixtures verify case-studies/03-multi-paper
      - name: materialize restores caches
        run: |
          python -m bionexus.cli fixtures materialize case-studies/01-egfr-blind-reproduction
          test -s .data/chembl_CHEMBL203.csv

  case-study:  # blind reproduction of a published paper (real ChEMBL data)
    runs-on: ubuntu-latest
    if: false  # requires LLM env; run manually or on schedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pydantic pytest scikit-learn rdkit && pip install -e . --no-deps
      - run: python case-studies/01-egfr-blind-reproduction/run.py

  sandbox-docker:  # S-T3 2b: live-kernel verification — no daemon = fail loud
    runs-on: ubuntu-latest
    env: {BN_REQUIRE_DOCKER: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pydantic pytest && pip install -e . --no-deps
      - name: Wait for the docker daemon
        run: timeout 120 sh -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
      - name: Live sandbox contract (egress, caps, ceilings, COW forks, cleanup)
        run: python -m pytest tests/test_sandbox_docker_live.py -q --tb=short -k "not session"
      - name: Build the in-sandbox worker image
        run: |
          python -m pip wheel . -w dist --no-deps
          cp dist/bionexuslab-*.whl .
          docker build -t bionexus-sandbox:ci -f Dockerfile.sandbox .
      - name: Session e2e — tools AND lab ops inside a real container
        env: {BN_SANDBOX_IMAGE: "bionexus-sandbox:ci"}
        run: python -m pytest tests/test_sandbox_docker_live.py -q --tb=short -k session
