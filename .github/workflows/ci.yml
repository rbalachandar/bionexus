name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:  # P1: fast, dependency-light, no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pydantic pytest && pip install -e . --no-deps
      - run: python -m pytest tests/ -q    # includes the anti-bloat import scan

  e2e:  # P8: full DMTA flow + templates + recording playback on the virtual lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pydantic pytest pyyaml numpy && pip install -e . --no-deps
      - name: Full flow (all layers)
        run: python examples/demo_full_flow.py
      - name: Provenance audit
        run: python -m bionexus.cli prove full-flow --db full_flow.db
      # - name: Template campaign
      #   run: python -m bionexus.cli auto examples/workflow.yml --db bionexus.db
      # - name: Provenance audit (template)
      #   run: python -m bionexus.cli prove demo-run --db bionexus.db
      - name: Test suite
        run: python -m pytest tests/ -q

  case-study:  # blind reproduction of a published paper (real ChEMBL data)
    runs-on: ubuntu-latest
    if: false  # requires LLM env; run manually or on schedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pydantic pytest scikit-learn rdkit && pip install -e . --no-deps
      - run: python case-studies/01-egfr-blind-reproduction/run.py
