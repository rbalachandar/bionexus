name: release

# Publishes to PyPI via Trusted Publishing (no token in repo).
# One-time setup on pypi.org: add a pending publisher
#   project: bionexus · owner: rbalachandar · repo: bionexus
#   workflow: release.yml · environment: pypi
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1

  smoke:  # install the published wheel and run one command
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install bionexus==${GITHUB_REF_NAME#v} && bn new-adapter lab smoke --dir /tmp && ls /tmp/smoke_adapter
