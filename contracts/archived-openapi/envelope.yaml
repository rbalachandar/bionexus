# Shared envelope reused by all v1 contracts.
# $ref from other files: envelope.yaml#/components/schemas/Envelope
openapi: 3.1.0
info:
  title: Agentic Drug Discovery — Shared Envelope
  version: 1.0.0
components:
  schemas:
    Envelope:
      type: object
      description: Common wrapper on every contract message.
      required: [contract_id, schema_version, experiment_branch_id, created_at]
      properties:
        contract_id:
          type: string
          format: uuid
        schema_version:
          type: string
          const: v1
        experiment_branch_id:
          type: string
          description: ULID of the experiment branch (sandbox fork lineage).
        parent_branch_id:
          type: string
          description: Present when the branch was created via sandbox fork.
        provenance_ref:
          type: string
          description: URI of the ProvenanceRecord covering this message.
        created_at:
          type: string
          format: date-time
        trace_id:
          type: string
          description: Distributed trace id for cross-service correlation.
    Ids:
      type: object
      description: Shared ID conventions.
      properties:
        ulid:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        branch_seq:
          type: object
          required: [branch_id, seq]
          properties:
            branch_id: { type: string }
            seq: { type: integer, format: int64, minimum: 0 }
