openapi: 3.1.0
info:
  title: AssayResult
  version: 1.0.0
  description: >
    Telemetry Ingestor (Block D) -> Orchestration (A) / Analysis Agent (B).
    Normalized wet-lab (or simulated) results with QC flags and run lineage.
paths: {}
components:
  schemas:
    AssayResult:
      type: object
      required: [envelope, run_id, protocol_id, status, measurements]
      properties:
        envelope:
          $ref: envelope.yaml#/components/schemas/Envelope
        run_id:
          type: string
          format: uuid
        protocol_id:
          type: string
          format: uuid
        instrument:
          type: object
          required: [adapter, instrument_id]
          properties:
            adapter:
              type: string
              description: IAL adapter id; "simulator" for the Virtual Lab.
            instrument_id: { type: string }
            raw_output_uri: { type: string }
        status:
          type: string
          enum: [completed, partial, failed, cancelled]
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/Measurement"
        qc:
          type: object
          properties:
            controls_passed: { type: boolean }
            failed_wells:
              type: array
              items: { type: string }
            notes: { type: string }

    Measurement:
      type: object
      required: [sample_id, assay_type, value, unit]
      properties:
        sample_id: { type: string }
        well: { type: string }
        assay_type: { type: string }
        value:
          type: number
          format: double
        unit: { type: string }
        uncertainty:
          type: number
          format: double
        replicate: { type: integer, minimum: 1 }
        derived_metrics:
          type: object
          additionalProperties: true
          description: e.g. IC50, Ki, percent inhibition.
        flags:
          type: array
          items:
            type: string
            enum: [out_of_range, below_lod, suspect, control]
