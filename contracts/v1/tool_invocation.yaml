openapi: 3.1.0
info:
  title: ToolInvocation / ToolResult
  version: 1.0.0
  description: >
    Typed calls from agents/orchestration to Model & Knowledge (C), Lab (D),
    and Simulation (E) services. Synchronous request/response; long jobs return
    job status URIs via ToolResult.job.
paths: {}
components:
  schemas:
    ToolInvocation:
      type: object
      required: [envelope, invocation_id, tool, args]
      properties:
        envelope:
          $ref: envelope.yaml#/components/schemas/Envelope
        invocation_id:
          type: string
          format: uuid
          description: Idempotency key.
        tool:
          $ref: "#/components/schemas/ToolName"
        args:
          type: object
          description: Argument schema fixed per tool name (see tools registry).
          additionalProperties: true
        timeout_secs: { type: integer, default: 300 }

    ToolResult:
      type: object
      required: [envelope, invocation_id, status]
      properties:
        envelope:
          $ref: envelope.yaml#/components/schemas/Envelope
        invocation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [succeeded, failed, rejected]
        output:
          type: object
          additionalProperties: true
          description: Tool-specific output (candidate list, scores, predictions...).
        job:
          type: object
          description: Present for long-running tools (MD jobs, wet-lab runs).
          required: [job_id, status_uri]
          properties:
            job_id: { type: string }
            status_uri: { type: string }
            poll_after_secs: { type: integer }
        model_version:
          type: string
          description: Pinned model+version (Block C) recorded for provenance.
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            rejection_reason:
              type: string
              description: Set when status=rejected (e.g. Safety Engine policy).

    ToolName:
      type: string
      description: Registered tool names, namespaced by owning block.
      enum:
        # Block C — models & knowledge
        - c.fm.predict_structure
        - c.fm.generate_molecules
        - c.fm.predict_property
        - c.fm.predict_admet
        - c.kb.search_literature
        - c.registry.get_put_candidate
        - c.evals.benchmark_batch
        - c.evals.rank_batch
        - c.flywheel.submit_example
        - c.flywheel.list_model_variants
        # Block D — lab
        - d.lab.list_capabilities
        - d.lab.submit_protocol
        - d.lab.get_status
        - d.lab.fetch_results
        - d.lab.cancel
        # Block E — simulation & data
        - e.sim.docking
        - e.sim.md_job
        - e.sim.assay_prediction
        - e.sim.trial_simulation
        - e.data.query_feature_store
