openapi: 3.1.0
info:
  title: ProvenanceRecord
  version: 1.0.0
  description: >
    Every block -> Provenance Store (Block A). Append-only, WORM, hash-chained.
    One record per artifact or decision event; never mutated.
paths: {}
components:
  schemas:
    ProvenanceRecord:
      type: object
      required: [envelope, record_id, event_type, actor, artifact]
      properties:
        envelope:
          $ref: envelope.yaml#/components/schemas/Envelope
        record_id:
          type: string
          format: uuid
        event_type:
          $ref: "#/components/schemas/EventType"
        actor:
          $ref: "#/components/schemas/Actor"
        artifact:
          $ref: "#/components/schemas/Artifact"
        inputs:
          type: array
          description: Lineage — artifacts/records this one was derived from.
          items:
            $ref: "#/components/schemas/Artifact"
        decision:
          type: object
          description: Required when event_type is a decision/gate event.
          properties:
            choice: { type: string }
            rationale: { type: string }
            approved_by: { type: string }
        prev_record_hash:
          type: string
          description: SHA-256 of the previous record in this branch (hash chain).
        record_hash:
          type: string
          description: SHA-256 over the canonical serialization of this record.

    EventType:
      type: string
      enum:
        - artifact_created      # dossier, molecule, biologic, protocol, report
        - model_invocation      # FM/gateway call, model+version pinned
        - tool_invocation       # any ToolInvocation/ToolResult
        - lab_run               # wet-lab run start/complete
        - simulation_job
        - evaluation            # benchmark harness result
        - gate_decision         # human approval/rejection/redirect
        - stage_transition
        - sandbox_fork          # branch created via snapshot fork
        - sandbox_snapshot

    Actor:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [agent, human, service, instrument]
        id: { type: string }
        sandbox_id:
          type: string
          description: AgentENV sandbox id when actor is an agent.
        model_version: { type: string }
        prompt_ref:
          type: string
          description: URI of the recorded prompt(s) used.

    Artifact:
      type: object
      required: [artifact_id, kind, uri, sha256]
      properties:
        artifact_id: { type: string }
        kind:
          type: string
          enum:
            [target_dossier, molecule, biologic, protocol, assay_result,
             trial_protocol, report, model_output, raw_telemetry, other]
        uri: { type: string }
        sha256: { type: string }
        metadata:
          type: object
          additionalProperties: true
