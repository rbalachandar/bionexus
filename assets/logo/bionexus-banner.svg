<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#1d232b"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="538" height="198" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="3" y="3" width="534" height="194" rx="12" fill="url(#dots)"/>

  <!-- lattice mark: a well-grid, one route, and the gate it must pass -->
  <g transform="translate(58 52)" stroke-linecap="square">
    <path d="M 0,24 H 96 M 0,48 H 96 M 0,72 H 96 M 24,0 V 96 M 48,0 V 96 M 72,0 V 96"
          fill="none" stroke="#21262d" stroke-width="4"/>
    <!-- frame with a 14px gap at the gate (bottom edge, x=72) -->
    <path d="M 0,0 H 96 V 96 H 79 M 65,96 H 0 V 0"
          fill="none" stroke="#30363d" stroke-width="5"/>
    <!-- the route: enters left, walks the wells, exits through the gate -->
    <path d="M -8,24 H 24 V 72 H 72 V 106"
          fill="none" stroke="#f0f6fc" stroke-width="5"/>
    <!-- nodes: verified decision points -->
    <circle cx="24" cy="24" r="6" fill="#f9826c"/>
    <circle cx="24" cy="72" r="6" fill="#f9826c"/>
    <circle cx="72" cy="72" r="6" fill="#f9826c"/>
    <!-- gate bar, same teal-gate role as the main brand -->
    <line x1="72" y1="88" x2="72" y2="106" stroke="#f9826c" stroke-width="5" stroke-linecap="round"/>
    <!-- pending well: a square, not yet a node -->
    <rect x="44" y="44" width="8" height="8" fill="#f0f6fc"/>
  </g>

  <!-- wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
     transform="translate(212 0)">
    <text y="118" font-size="44" font-weight="800" letter-spacing="-1">
      <tspan fill="#f0f6fc">bio</tspan><tspan fill="#f9826c">nexus</tspan><tspan
      fill="#f0f6fc">.</tspan>
    </text>
    <text y="150" x="4" font-size="13" font-weight="400" fill="#8b949e"
          letter-spacing="5">AGENTIC LAB FRAMEWORK</text>
  </g>

</svg>
